name: Temporary APK

on:
  workflow_dispatch:
    inputs:
      abi:
        description: "APK ABI (universal builds all)"
        required: true
        default: universal
        type: choice
        options:
          - universal
          - arm64-v8a
          - armeabi-v7a
          - x86
          - x86_64
  push:
    branches:
      - ci-apk

permissions:
  contents: read

jobs:
  libcore:
    name: Native Build (LibCore)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: LibCore Cache
        id: cache
        uses: actions/cache@v4
        with:
          path: app/libs/libcore.aar
          key: libcore-${{ hashFiles('buildScript/**', 'libcore/**', '.github/workflows/*') }}
      - name: Install Golang
        if: steps.cache.outputs.cache-hit != 'true'
        uses: actions/setup-go@v5
        with:
          go-version: ^1.25
          cache-dependency-path: libcore/go.sum
      - name: Native Build
        if: steps.cache.outputs.cache-hit != 'true'
        run: ./run lib core
      - name: Upload LibCore
        uses: actions/upload-artifact@v4
        with:
          name: libcore-aar
          path: app/libs/libcore.aar
          retention-days: 1
          if-no-files-found: error

  build:
    name: Build Temporary APK
    runs-on: ubuntu-latest
    needs:
      - libcore
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Download LibCore
        uses: actions/download-artifact@v4
        with:
          name: libcore-aar
          path: app/libs
      - name: Gradle cache
        uses: actions/cache@v4
        with:
          path: ~/.gradle
          key: gradle-temp-${{ hashFiles('**/*.gradle.kts') }}
      - name: Gradle Build
        env:
          BUILD_PLUGIN: none
        run: |
          set -e
          echo "sdk.dir=${ANDROID_HOME}" > local.properties
          echo "ndk.dir=${ANDROID_HOME}/ndk/25.0.8775105" >> local.properties
          keytool -genkeypair -v -storetype PKCS12 -keystore preview.keystore -storepass android -keypass android -alias preview -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=NekoBox Temp, OU=Temp, O=NekoBox, L=Temp, S=Temp, C=US"
          export LOCAL_PROPERTIES="$(base64 -w 0 local.properties)"
          ./run init action gradle
          ./gradlew app:assemblePreviewRelease --no-daemon
          APKSIGNER=$(find "${ANDROID_HOME}/build-tools" -name apksigner | sort -V | tail -n 1)
          mkdir -p temp-apk
          for APK_UNSIGNED in $(find app/build/outputs/apk -name '*unsigned*.apk'); do
            APK_SIGNED="temp-apk/$(basename "${APK_UNSIGNED/-unsigned/}")"
            "$APKSIGNER" sign --ks preview.keystore --ks-pass pass:android --ks-key-alias preview --key-pass pass:android --v1-signing-enabled true --v2-signing-enabled true --out "$APK_SIGNED" "$APK_UNSIGNED"
          done
          ABI="${{ github.event.inputs.abi }}"
          if [ -n "$ABI" ] && [ "$ABI" != "universal" ]; then
            find temp-apk -name '*.apk' ! -name "*-$ABI.apk" -delete
          fi
          ls -lh temp-apk
      - uses: actions/upload-artifact@v4
        with:
          name: NekoBox-temp-apk
          path: temp-apk/*.apk
          retention-days: 7
          if-no-files-found: error
