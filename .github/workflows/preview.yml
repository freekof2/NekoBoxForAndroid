name: Preview Build
on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
jobs:
  libcore:
    name: Native Build (LibCore)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Golang Status
        run: find buildScript libcore/*.sh | xargs cat | sha1sum > golang_status
      - name: Libcore Status
        run: git ls-files libcore | xargs cat | sha1sum > libcore_status
      - name: LibCore Cache
        id: cache
        uses: actions/cache@v4
        with:
          path: |
            app/libs/libcore.aar
          key: ${{ hashFiles('.github/workflows/*', 'golang_status', 'libcore_status') }}
      - name: Install Golang
        if: steps.cache.outputs.cache-hit != 'true'
        uses: actions/setup-go@v5
        with:
          go-version: ^1.25
          cache-dependency-path: libcore/go.sum
      - name: Native Build
        if: steps.cache.outputs.cache-hit != 'true'
        run: ./run lib core
  build:
    name: Build OSS APK
    runs-on: ubuntu-latest
    needs:
      - libcore
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Golang Status
        run: find buildScript libcore/*.sh | xargs cat | sha1sum > golang_status
      - name: Libcore Status
        run: git ls-files libcore | xargs cat | sha1sum > libcore_status
      - name: LibCore Cache
        uses: actions/cache@v4
        with:
          path: |
            app/libs/libcore.aar
          key: ${{ hashFiles('.github/workflows/*', 'golang_status', 'libcore_status') }}
      - name: Gradle cache
        uses: actions/cache@v4
        with:
          path: ~/.gradle
          key: gradle-oss-${{ hashFiles('**/*.gradle.kts') }}
      - name: Gradle Build
        env:
          BUILD_PLUGIN: none
        run: |
          echo "sdk.dir=${ANDROID_HOME}" > local.properties
          echo "ndk.dir=${ANDROID_HOME}/ndk/25.0.8775105" >> local.properties
          keytool -genkeypair -v -storetype PKCS12 -keystore preview.keystore -storepass android -keypass android -alias preview -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=NekoBox Preview, OU=Preview, O=NekoBox, L=Preview, S=Preview, C=US"
          export LOCAL_PROPERTIES="$(base64 -w 0 local.properties)"
          ./run init action gradle
          ./gradlew app:assemblePreviewRelease
          APKSIGNER=$(find "${ANDROID_HOME}/build-tools" -name apksigner | sort -V | tail -n 1)
          for APK_UNSIGNED in $(find app/build/outputs/apk -name '*unsigned*.apk'); do
            APK_SIGNED="${APK_UNSIGNED/-unsigned/}"
            "$APKSIGNER" sign --ks preview.keystore --ks-pass pass:android --ks-key-alias preview --key-pass pass:android --v1-signing-enabled true --v2-signing-enabled true --out "$APK_SIGNED" "$APK_UNSIGNED"
            rm "$APK_UNSIGNED"
          done
          APK=$(find app/build/outputs/apk -name '*universal*.apk' -o -name '*arm64-v8a*.apk' | head -n 1)
          APK=$(dirname $APK)
          echo "APK=$APK" >> $GITHUB_ENV
      - uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: APKs
          path: ${{ env.APK }}
          retention-days: 1
